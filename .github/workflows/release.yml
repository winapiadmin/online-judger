name: (beta) release for every commit

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch, tag, or commit
        required: false
        default: main
  push:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref || github.ref }}

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_GUI=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests (evaluators)
        working-directory: build
        run: ctest --output-on-failure

      - name: End-to-end test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # MinGW g++ is used as the contestant compiler in the e2e config
            for d in /c/mingw64/bin /c/msys64/mingw64/bin /c/Strawberry/c/bin; do
              [ -x "$d/g++.exe" ] && export PATH="$d:$PATH" && break
            done
            BIN=build/main_judger.exe
          else
            BIN=build/main_judger
          fi
          g++ --version | head -n 1
          bash tests/e2e_test.sh "$BIN" build

      - name: Install
        run: cmake --install build --prefix publish --config Debug

      - name: Zip artifacts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell Compress-Archive -Path publish\* -DestinationPath build-${{ runner.os }}-x86_64.zip
          else
            zip -r build-${{ runner.os }}-x86_64.zip publish
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: build-${{ github.sha }}
          files: build-${{ runner.os }}-x86_64.zip
